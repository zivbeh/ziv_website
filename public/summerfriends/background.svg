<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft summer gradient inspired by the green theme of the project -->
    <linearGradient id="sfmBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf3;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#bbf7d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle world map blob shapes -->
    <linearGradient id="landGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.9" />
    </linearGradient>

    <!-- Route line glow -->
    <filter id="routeGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pin drop shadow -->
    <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14532d" flood-opacity="0.35" />
    </filter>

    <!-- Dotted grid pattern for "map" feel -->
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.3" fill="#bbf7d0" opacity="0.6" />
      <circle cx="40" cy="40" r="1.3" fill="#bbf7d0" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#sfmBgGradient)" />

  <!-- Subtle grid overlay -->
  <rect width="1920" height="1080" fill="url(#dotGrid)" opacity="0.7" />

  <!-- World-ish land blobs (kept abstract so it feels lightweight and not political) -->
  <g opacity="0.45">
    <!-- Left continent -->
    <path
      d="M280 310
         C 200 240, 220 140, 340 120
         C 460 100, 560 160, 560 260
         C 560 360, 500 440, 420 450
         C 340 460, 260 420, 250 370
         Z"
      fill="url(#landGradient)"
    />

    <!-- Right continent -->
    <path
      d="M1320 260
         C 1220 220, 1180 140, 1270 110
         C 1380 80, 1550 90, 1600 180
         C 1650 270, 1610 340, 1520 380
         C 1430 420, 1360 390, 1320 340
         Z"
      fill="url(#landGradient)"
    />

    <!-- Lower cluster -->
    <path
      d="M780 650
         C 700 610, 690 520, 770 500
         C 860 480, 980 490, 1040 540
         C 1100 590, 1060 670, 980 690
         C 900 710, 820 690, 780 650
         Z"
      fill="url(#landGradient)"
    />
  </g>

  <!-- Curved meetup routes between "friends" -->
  <g stroke-linecap="round" fill="none" filter="url(#routeGlow)">
    <!-- Route 1 -->
    <path
      d="M360 260
         C 600 160, 900 140, 1320 260"
      stroke="#f97316"
      stroke-width="4"
      stroke-dasharray="10 8"
      opacity="0.85"
    />

    <!-- Route 2 -->
    <path
      d="M420 440
         C 650 460, 880 520, 1120 460
         C 1320 410, 1500 420, 1560 460"
      stroke="#22c55e"
      stroke-width="3.5"
      stroke-dasharray="8 7"
      opacity="0.85"
    />

    <!-- Route 3 (lower arc) -->
    <path
      d="M520 700
         C 760 640, 1040 640, 1360 720"
      stroke="#0ea5e9"
      stroke-width="3.5"
      stroke-dasharray="8 7"
      opacity="0.8"
    />
  </g>

  <!-- Meetup pins -->
  <g filter="url(#pinShadow)">
    <!-- Pin helper as a symbol (draw inline for portability) -->
    <!-- Left pin -->
    <g transform="translate(360,260)">
      <path
        d="M0 -18
           C -12 -18, -20 -9, -20 3
           C -20 15, -10 30, 0 42
           C 10 30, 20 15, 20 3
           C 20 -9, 12 -18, 0 -18 Z"
        fill="#22c55e"
      />
      <circle cx="0" cy="0" r="8" fill="#ecfdf3" />
    </g>

    <!-- Top-right pin -->
    <g transform="translate(1480,270)">
      <path
        d="M0 -18
           C -12 -18, -20 -9, -20 3
           C -20 15, -10 30, 0 42
           C 10 30, 20 15, 20 3
           C 20 -9, 12 -18, 0 -18 Z"
        fill="#0ea5e9"
      />
      <circle cx="0" cy="0" r="8" fill="#ecfdf3" />
    </g>

    <!-- Middle pin -->
    <g transform="translate(1120,460)">
      <path
        d="M0 -18
           C -12 -18, -20 -9, -20 3
           C -20 15, -10 30, 0 42
           C 10 30, 20 15, 20 3
           C 20 -9, 12 -18, 0 -18 Z"
        fill="#f97316"
      />
      <circle cx="0" cy="0" r="8" fill="#ecfdf3" />
    </g>

    <!-- Lower-left pin -->
    <g transform="translate(640,660)">
      <path
        d="M0 -18
           C -12 -18, -20 -9, -20 3
           C -20 15, -10 30, 0 42
           C 10 30, 20 15, 20 3
           C 20 -9, 12 -18, 0 -18 Z"
        fill="#16a34a"
      />
      <circle cx="0" cy="0" r="8" fill="#ecfdf3" />
    </g>

    <!-- Lower-right pin -->
    <g transform="translate(1400,720)">
      <path
        d="M0 -18
           C -12 -18, -20 -9, -20 3
           C -20 15, -10 30, 0 42
           C 10 30, 20 15, 20 3
           C 20 -9, 12 -18, 0 -18 Z"
        fill="#22c55e"
      />
      <circle cx="0" cy="0" r="8" fill="#ecfdf3" />
    </g>
  </g>

  <!-- Card-like highlight in the center where the actual app screenshot could sit -->
  <g opacity="0.9">
    <rect
      x="560"
      y="260"
      rx="40"
      ry="40"
      width="800"
      height="460"
      fill="#ecfdf3"
      opacity="0.75"
      stroke="#22c55e"
      stroke-width="3"
    />
    <!-- Optional header bar hint -->
    <rect x="600" y="300" width="160" height="10" rx="5" fill="#bbf7d0" opacity="0.9" />
    <rect x="600" y="330" width="220" height="8" rx="4" fill="#6ee7b7" opacity="0.85" />
    <rect x="600" y="355" width="180" height="8" rx="4" fill="#a5f3fc" opacity="0.7" />
  </g>

  <!-- Caption text (subtle, won't clash with overlaid UI) -->
  <g opacity="0.6">
    <text
      x="140"
      y="920"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
      font-size="32"
      fill="#064e3b"
      font-weight="600"
    >
      Summer Meetup Map
    </text>
    <text
      x="140"
      y="962"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
      font-size="20"
      fill="#15803d"
    >
      See where everyone is this summer and plan the perfect meetup.
    </text>
  </g>
</svg>


